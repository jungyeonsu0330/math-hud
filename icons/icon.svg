<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Cybernetic Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#7000ff" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Integral Symbol & Sigma Fusion -->
  <path d="M 210,130 C 235,110 265,115 260,150 L 235,320 C 230,355 210,380 180,375" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Cross Math Curve / Wave -->
  <path d="M 140,290 Q 230,160 300,260 T 390,200" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- HUD Nodes / Vertices -->
  <circle cx="230" cy="210" r="8" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="300" cy="260" r="8" fill="#ffd000" filter="url(#glow)"/>
  <circle cx="390" cy="200" r="8" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Math Symbol Text fx -->
  <text x="320" y="360" fill="#00f0ff" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="58" filter="url(#glow)" letter-spacing="2">f(x)</text>
</svg>
